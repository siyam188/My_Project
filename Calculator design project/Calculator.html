<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator design project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculator</h1>
    
    <div class="card">
    <div class="display">
        <input type="text"id="result" maxlength="10">
    </div>
    <div class="buttons">
       <div>
        <input type="button"class="bnt"value="C">
         <input type="button"class="bnt"value="+/-">
          <input type="button"class="bnt"value="%">
           <input type="button"class="bnt bnt-style"value="/">
       </div>
        <div>
        <input type="button"class="bnt"value="7">
         <input type="button"class="bnt"value="8">
          <input type="button"class="bnt"value="9">
           <input type="button"class="bnt bnt-style"value="*">
       </div>
        <div>
        <input type="button"class="bnt"value="4">
         <input type="button"class="bnt"value="5">
          <input type="button"class="bnt"value="6">
           <input type="button"class="bnt bnt-style"value="-">
       </div>
        <div>
        <input type="button"class="bnt"value="1">
         <input type="button"class="bnt"value="2">
          <input type="button"class="bnt"value="3">
           <input type="button"class="bnt bnt-style"value="+">
       </div>
       
        <div>
        <input type="button"class="bnt"value="0">
         <input type="button"class="bnt"value=".">
          <input type="button"class="bnt"value="DEL">
           <input type="button"class="bnt" style="background-color: orange;" value="=">
    </div>
    </div>
</body>
</html>
